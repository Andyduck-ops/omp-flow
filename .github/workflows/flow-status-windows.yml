name: Tests

on:
  push:
    paths:
      - "src/cli/**"
      - "src/omp/**"
      - "templates/**"
      - "integrations/ccstatusline/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/flow-status-windows.yml"
  pull_request:
    paths:
      - "src/cli/**"
      - "src/omp/**"
      - "templates/**"
      - "integrations/ccstatusline/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/flow-status-windows.yml"

permissions:
  contents: read

jobs:
  portable-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -X utf8 -m compileall -q templates/.omp-flow/scripts templates/codex/hooks templates/claude/hooks templates/snow/hooks templates/cursor/hooks
      - run: python -X utf8 tests/codex-hooks.test.py
      - run: python -X utf8 tests/claude-hooks.test.py
      - run: python -X utf8 tests/snow-hooks.test.py
      - run: python -X utf8 tests/cursor-hooks.test.py
      - run: python -X utf8 tests/operation-store.test.py

  installed-artifact:
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: npm ci
      - run: python -X utf8 -m compileall -q templates/.omp-flow/scripts templates/claude/hooks
      - run: npm run build
      - run: node tests/flow-status-final-repair.test.mjs
      - run: npm test
      - run: node integrations/ccstatusline/build.mjs --online --output .flow-status-artifacts
      - shell: pwsh
        run: |
          $tarball = (Get-ChildItem .flow-status-artifacts -Filter *.tgz | Select-Object -First 1).FullName
          if (-not $tarball) { throw "compatible ccstatusline tarball was not produced" }
          $env:OMP_FLOW_CCSTATUSLINE_TARBALL = $tarball
          $env:OMP_FLOW_BENCHMARK_STRICT = "1"
          node tests/flow-status-v2-benchmark.mjs
          node tests/flow-status-installed.mjs
